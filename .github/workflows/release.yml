name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update workspace version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i "s/bitfold-core = { path = \"crates\/bitfold-core\", version = \".*\" }/bitfold-core = { path = \"crates\/bitfold-core\", version = \"$VERSION\" }/" Cargo.toml
          sed -i "s/bitfold-protocol = { path = \"crates\/bitfold-protocol\", version = \".*\" }/bitfold-protocol = { path = \"crates\/bitfold-protocol\", version = \"$VERSION\" }/" Cargo.toml
          sed -i "s/bitfold-peer = { path = \"crates\/bitfold-peer\", version = \".*\" }/bitfold-peer = { path = \"crates\/bitfold-peer\", version = \"$VERSION\" }/" Cargo.toml
          sed -i "s/bitfold-host = { path = \"crates\/bitfold-host\", version = \".*\" }/bitfold-host = { path = \"crates\/bitfold-host\", version = \"$VERSION\" }/" Cargo.toml

      - name: Update Cargo.lock
        run: cargo update --workspace

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${{ steps.get_version.outputs.version }}"
          git push origin HEAD:main

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Publish bitfold-core
        run: cargo publish -p bitfold-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish bitfold-protocol
        run: cargo publish -p bitfold-protocol --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish bitfold-peer
        run: cargo publish -p bitfold-peer --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish bitfold-host
        run: cargo publish -p bitfold-host --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish bitfold
        run: cargo publish -p bitfold --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
