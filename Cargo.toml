[workspace]
resolver = "2"
members = [
    "crates/malnet-core",
    "crates/malnet-protocol",
    "crates/malnet-peer",
    "crates/malnet-host",
    "crates/malnet",
]

[workspace.package]
version = "0.0.23"
authors = ["Casey Bird"]
edition = "2021"
rust-version = "1.90.0"
license = "MIT"
homepage = "https://github.com/russellwmy/malnet"
repository = "https://github.com/russellwmy/malnet"

[workspace.dependencies]
# Workspace crates
malnet-core = { path = "crates/malnet-core", version = "0.0.23" }
malnet-protocol = { path = "crates/malnet-protocol", version = "0.0.23" }
malnet-peer = { path = "crates/malnet-peer", version = "0.0.23" }
malnet-host = { path = "crates/malnet-host", version = "0.0.23" }

# External dependencies
byteorder = "1.5.0"
rand = "0.9.2"
crc32fast = "1.5.0"
flate2 = "1.1.7"
lz4 = "1.28.1"
tracing = "0.1.43"
crossbeam-channel = "0.5.15"
socket2 = "0.6.1"
dns-lookup = "3.0.1"
x25519-dalek = { version = "0.3.0", features = ["getrandom"] }   # X25519 Diffie-Hellman # cryptographically secure RNG
sha2 = "0.10"                   # SHA-256 for key derivation

# Dev dependencies
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"

[profile.dev]
panic = 'abort'

[profile.release]
overflow-checks = true
panic = 'abort'
lto = "fat"
codegen-units = 1

# A much faster to compile version of `release`, for development use.
[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
debug-assertions = true

# Used for fuzzing, LTO is ill-supported as of 2023-09 and so should not be enabled.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[workspace.lints.clippy]
all = { level = "allow", priority = -100 }
correctness = { level = "deny", priority = -50 }
suspicious = { level = "deny", priority = -50 }
perf = { level = "deny", priority = -50 }
# overrides clippy::perf = "deny": https://github.com/rust-lang/rust-clippy/issues/8111
single_char_pattern = "allow"
clone_on_copy = "deny"
derivable_impls = "deny"
redundant_clone = "deny"
len_zero = "deny"
or_fun_call = "deny"
unnecessary_lazy_evaluations = "deny"

[workspace.lints.rust]
# Will take effect since Rust 1.80, produces unused warning before it: https://github.com/rust-lang/cargo/pull/13913
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(enable_const_type_id)'] }
